{
  "services": [
    {
      "type": "web",
      "name": "nagrikseva-backend",
      "env": "python",
      "buildCommand": "pip install -r backend_requirements.txt",
      "startCommand": "uvicorn app.main:app --host 0.0.0.0 --port $PORT",
      "envVars": [
        { "key": "GEMINI_API_KEY", "sync": false },
        { "key": "DATABASE_URL", "value": "sqlite:///./nagrikseva.db" },
        { "key": "ADMIN_SECRET", "sync": false }
      ],
      "autoDeploy": true
    }
  ]
}
